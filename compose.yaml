services:
  sqlserver:
    image: mcr.microsoft.com/mssql/server:2022-latest
    environment:
      ACCEPT_EULA: "Y"
      MSSQL_PID: Developer
      MSSQL_SA_PASSWORD: "${MSSQL_SA_PASSWORD:-LocalOnly_Cart2026!}"
    ports:
      - "127.0.0.1:14330:1433"
    volumes:
      - sqlserver-data:/var/opt/mssql
    healthcheck:
      test: ["CMD-SHELL", "/opt/mssql-tools18/bin/sqlcmd -S localhost -U sa -P \"$$MSSQL_SA_PASSWORD\" -C -Q 'SELECT 1' -b -o /dev/null"]
      interval: 5s
      timeout: 5s
      retries: 30
      start_period: 20s

  database:
    build:
      context: .
      dockerfile: eCommerce.Database/Dockerfile
    environment:
      ConnectionStrings__Cart: "Server=sqlserver,1433;Database=eCommerce;User Id=sa;Password=${MSSQL_SA_PASSWORD:-LocalOnly_Cart2026!};Encrypt=True;TrustServerCertificate=True"
      Database__SeedDemo: "true"
    depends_on:
      sqlserver:
        condition: service_healthy

  cart-api:
    build:
      context: .
      dockerfile: eCommerce.Backend/Dockerfile
    ports:
      - "127.0.0.1:5005:8080"
    environment:
      ASPNETCORE_ENVIRONMENT: Development
      Authentication__DemoEnabled: "true"
      ConnectionStrings__Cart: "Server=sqlserver,1433;Database=eCommerce;User Id=sa;Password=${MSSQL_SA_PASSWORD:-LocalOnly_Cart2026!};Encrypt=True;TrustServerCertificate=True"
    depends_on:
      database:
        condition: service_completed_successfully
volumes:
  sqlserver-data:

